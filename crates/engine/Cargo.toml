[package]
name = "smpl3d-engine"
description = "Smpl3D engine: the session, the command registry (everything is a command), undo/redo and selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Optional authored texture/HDR bytes; the command registry and metadata remain available.
bundled-render-library = []
raytrace-cpu = ["smpl3d-render/raytrace-cpu"]
# Turns on the parameter-contract audit recorder (`SMPL3D_PARAM_AUDIT`, see
# `src/schema/record.rs`), for checking a new contract against the whole test suite.
param-audit = []
solver-profiling = ["smpl3d-sketch/solver-profiling"]

[[example]]
name = "sketch_analysis_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_drag_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_target_bench"
required-features = ["solver-profiling"]

[dependencies]
smpl3d-geom = { workspace = true }
smpl3d-sketch = { workspace = true }
smpl3d-kernel = { workspace = true }
smpl3d-doc = { workspace = true }
smpl3d-io = { workspace = true }
smpl3d-render = { workspace = true }
# reference pictures for inspect.compare_picture (PNG and JPEG decode, PNG encode)
image = { workspace = true, features = ["jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = "0.25"
schemars = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
# Model-cache tests also run in a source tarball build (no git commit).
smpl3d-io = { workspace = true, features = ["trust-unknown-source"] }
# Normal CI exercises profiling assertions without enabling the production feature.
smpl3d-sketch = { workspace = true, features = ["solver-profiling"] }

[[example]]
name = "render_resource_workflow"
required-features = ["raytrace-cpu"]
